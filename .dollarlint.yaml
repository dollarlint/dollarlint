version: 1

discovery:
  include:
    - "*.json"
    - "**/*.json"
    - "*.yaml"
    - "**/*.yaml"
    - "*.yml"
    - "**/*.yml"
    - "*.toml"
    - "**/*.toml"
  exclude:
    - ".git"
    - "**/.git/**"
    - "node_modules"
    - "**/node_modules/**"
    - "dist"
    - "**/dist/**"
    - "build"
    - "**/build/**"
    - "coverage"
    - "**/coverage/**"
    - ".next"
    - "**/.next/**"
    - ".astro"
    - "**/.astro/**"

schema:
  fetchRemote: true
  fetch:
    retries: 2
    retryMinWait: 250ms
    retryMaxWait: 2s
  maxDepth: 8
  schemaStore:
    enabled: true
    url: https://www.schemastore.org/api/json/catalog.json
    strict: false

timeouts:
  fetch: 10s
  compile: 30s

output:
  locations: true
