name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"

      - name: Test
        run: go test ./...

      - name: Core SDK coverage
        run: |
          go test -coverprofile=coverage.out .
          go tool cover -func=coverage.out
