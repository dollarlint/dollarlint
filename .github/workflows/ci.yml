name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Test
        run: go test ./...

      - name: Core coverage
        run: |
          go test -coverprofile=coverage.out ./internal/engine
          go tool cover -func=coverage.out
          coverage="$(go tool cover -func=coverage.out | awk '/^total:/ { sub(/%/, "", $3); print $3 }')"
          awk -v coverage="$coverage" -v minimum="90.0" 'BEGIN {
            if (coverage + 0 < minimum) {
              printf "coverage %.1f%% is below required %.1f%%\n", coverage, minimum
              exit 1
            }
          }'

  test-windows:
    name: Test Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Test
        run: go test ./...

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Go formatting
        run: |
          unformatted="$(find . -name '*.go' -not -path './vendor/*' -print0 | xargs -0 gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "Go files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./...

      - name: Lint GitHub Actions workflows
        run: |
          bash -lc '
            set -euo pipefail
            workflows=()
            while IFS= read -r workflow; do
              workflows+=("$workflow")
            done < <(find .github/workflows -maxdepth 1 -type f \( -name "*.yml" -o -name "*.yaml" \) ! -name "*.lock.yml" | sort)
            if [ "${#workflows[@]}" -gt 0 ]; then
              go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 "${workflows[@]}"
            fi
            lock_workflows=()
            while IFS= read -r workflow; do
              lock_workflows+=("$workflow")
            done < <(find .github/workflows -maxdepth 1 -type f -name "*.lock.yml" | sort)
            if [ "${#lock_workflows[@]}" -gt 0 ]; then
              go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= "${lock_workflows[@]}"
            fi
          '

      - name: Validate repository configs
        run: go run ./cmd/dollarlint validate . --exclude .goreleaser.yaml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        run: npm ci

      - name: Check docs formatting
        run: npm run format:check

      - name: Audit docs dependencies
        run: npm run audit

      - name: Build docs
        run: npm run build

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build release snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser-pro
          version: "~> v2"
          args: release --snapshot --clean --skip=winget,homebrew

      - name: Audit generated npm wrapper
        run: npm audit --audit-level=high --prefix dist/npm/dollarlint
