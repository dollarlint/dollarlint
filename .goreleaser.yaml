# yaml-language-server: $schema=https://goreleaser.com/static/schema-pro.json

version: 2

project_name: dollarlint

metadata:
  license: MIT
  homepage: https://github.com/agorischek/dollarlint
  description: Validate JSON-family, YAML, and TOML files against their declared JSON Schemas.

before:
  hooks:
    - go test -short ./...

builds:
  - id: dollarlint
    main: ./cmd/dollarlint
    binary: dollarlint
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/agorischek/dollarlint/internal/cli.version={{ .Version }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: dollarlint
    ids:
      - dollarlint
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    formats:
      - tar.gz
    files:
      - README.md
      - LICENSE*
      - schemas/dollarlint.schema.json
      - src: examples/basics/*
        dst: examples/basics
      - src: examples/schemastore/*
        dst: examples/schemastore
      - src: examples/azure/*
        dst: examples/azure
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

npms:
  - id: dollarlint
    ids:
      - dollarlint
    name: dollarlint
    description: Validate JSON-family, YAML, and TOML files against their declared JSON Schemas.
    homepage: https://github.com/agorischek/dollarlint
    keywords:
      - cli
      - json-schema
      - json
      - yaml
      - toml
      - validation
    license: MIT
    repository: https://github.com/agorischek/dollarlint
    bugs: https://github.com/agorischek/dollarlint/issues
    access: public

release:
  github:
    owner: agorischek
    name: dollarlint
