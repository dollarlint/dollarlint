# yaml-language-server: $schema=https://goreleaser.com/static/schema-pro.json

version: 2

project_name: dollarlint

metadata:
  license: MIT
  homepage: https://github.com/dollarlint/dollarlint
  description: Validate JSON-family, YAML, and TOML files against their declared JSON Schemas.

before:
  hooks:
    - go test -short ./...

builds:
  - id: dollarlint
    main: ./cmd/dollarlint
    binary: dollarlint
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/dollarlint/dollarlint/internal/cli.version={{ .Version }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: dollarlint
    ids:
      - dollarlint
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    formats:
      - tar.gz
    files:
      - README.md
      - LICENSE*
      - schemas/dollarlint.schema.json
      - src: examples/basics/*
        dst: examples/basics
      - src: examples/schemastore/*
        dst: examples/schemastore
      - src: examples/azure/*
        dst: examples/azure
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  ai:
    use: openai
    prompt: |
      Write the release notes for this release.

      Instructions:
      - do not use emojis
      - write a short summary featuring the 2 or 3 most exciting or user-impacting changes, if it makes sense to do so
      - if many commits update the same dependency, group them in a single line and include the original version and latest version
      - respond with only the generated release notes, nothing else
      - format the response as markdown
      - do not change the original commit messages

      Project name: {{ .ProjectName }}
      Git repository URL: {{ .GitURL }}
      Previous version: {{ .PreviousTag }}
      Version: {{ .Tag }}

      Release notes:
      {{ .ReleaseNotes }}
  filters:
    exclude:
      - "^docs:"
      - "^test:"

npms:
  - id: dollarlint
    ids:
      - dollarlint
    name: dollarlint
    description: Validate JSON-family, YAML, and TOML files against their declared JSON Schemas.
    homepage: https://github.com/dollarlint/dollarlint
    keywords:
      - cli
      - json-schema
      - json
      - yaml
      - toml
      - validation
    license: MIT
    repository: https://github.com/dollarlint/dollarlint
    bugs: https://github.com/dollarlint/dollarlint/issues
    files:
      - glob: npm/README.md
        name_template: README.md
      - glob: LICENSE
    access: public

brews:
  - name: dollarlint
    ids:
      - dollarlint
    repository:
      owner: dollarlint
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/dollarlint/dollarlint
    description: Validate JSON-family, YAML, and TOML files against their declared JSON Schemas.
    license: MIT
    install: |
      bin.install "dollarlint"
    test: |
      system "#{bin}/dollarlint", "--version"

release:
  github:
    owner: dollarlint
    name: dollarlint
