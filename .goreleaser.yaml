# yaml-language-server: $schema=https://goreleaser.com/static/schema-pro.json

version: 2

pro: true

project_name: dollarlint

metadata:
  license: MIT
  homepage: https://github.com/dollarlint/dollarlint
  description: Validate JSON-family, YAML, and TOML files against their declared JSON Schemas.

before:
  hooks:
    - go test -short ./...

builds:
  - id: dollarlint
    main: ./cmd/dollarlint
    binary: dollarlint
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/dollarlint/dollarlint/internal/cli.version={{ .Version }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: dollarlint
    ids:
      - dollarlint
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    formats:
      - tar.gz
    files:
      - README.md
      - LICENSE*
      - schemas/dollarlint.schema.json
      - src: examples/basics/*
        dst: examples/basics
      - src: examples/schemastore/*
        dst: examples/schemastore
      - src: examples/azure/*
        dst: examples/azure
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  ai:
    use: openai
    prompt: |
      Write the release notes for this release.

      Instructions:
      - do not use emojis
      - write a short summary featuring the 2 or 3 most exciting or user-impacting changes, if it makes sense to do so
      - if many commits update the same dependency, group them in a single line and include the original version and latest version
      - respond with only the generated release notes, nothing else
      - format the response as markdown
      - do not change the original commit messages

      Project name: {{ .ProjectName }}
      Git repository URL: {{ .GitURL }}
      Previous version: {{ .PreviousTag }}
      Version: {{ .Tag }}

      Release notes:
      {{ .ReleaseNotes }}
  filters:
    exclude:
      - "^docs:"
      - "^test:"

npms:
  - id: dollarlint
    ids:
      - dollarlint
    name: dollarlint
    description: Validate JSON-family, YAML, and TOML files against their declared JSON Schemas.
    homepage: https://dollarlint.dev
    keywords:
      - cli
      - json-schema
      - json
      - yaml
      - toml
      - validation
    license: MIT
    repository: https://github.com/dollarlint/dollarlint
    bugs: https://github.com/dollarlint/dollarlint/issues
    files:
      - glob: npm/README.md
        name_template: README.md
      - glob: LICENSE
    access: public

homebrew_casks:
  - name: dollarlint
    ids:
      - dollarlint
    binaries:
      - dollarlint
    repository:
      owner: dollarlint
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    url:
      verified: github.com/dollarlint/dollarlint/
    homepage: https://dollarlint.dev/
    description: Validate JSON-family, YAML, and TOML files against their declared JSON Schemas
    commit_msg_template: "Brew cask update for {{ .ProjectName }} version {{ .Tag }}"
    hooks:
      post:
        install: |
          system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/dollarlint"] if OS.mac?

winget:
  - name: DollarLint
    package_name: DollarLint
    package_identifier: DollarLint.DollarLint
    publisher: DollarLint
    publisher_url: https://github.com/dollarlint
    publisher_support_url: https://github.com/dollarlint/dollarlint/issues
    short_description: Validate JSON-family, YAML, and TOML files against their declared JSON Schemas.
    description: DollarLint validates JSON, JSONC, JSON5, JSON Lines, YAML, and TOML files against JSON Schemas.
    homepage: https://github.com/dollarlint/dollarlint
    license: MIT
    license_url: https://github.com/dollarlint/dollarlint/blob/main/LICENSE
    release_notes: "{{ .Changelog }}"
    release_notes_url: "https://github.com/dollarlint/dollarlint/releases/tag/{{ .Tag }}"
    tags:
      - cli
      - json-schema
      - json
      - yaml
      - toml
      - validation
    ids:
      - dollarlint
    use: archive
    goamd64: v1
    commit_msg_template: "DollarLint.DollarLint: {{ .Tag }}"
    repository:
      owner: dollarlint
      name: winget-pkgs
      branch: "dollarlint-{{ .Version }}"
      token: "{{ .Env.WINGET_GITHUB_TOKEN }}"
      token_type: github
      pull_request:
        enabled: true
        draft: true
        check_boxes: false
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
    commit_author:
      name: dollarlint-release
      email: release@dollarlint.dev

release:
  github:
    owner: dollarlint
    name: dollarlint
