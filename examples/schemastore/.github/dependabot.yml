# yaml-language-server: $schema=https://www.schemastore.org/dependabot-2.0.json
version: 2
updates:
  - package-ecosystem: go
    directory: /
    schedule:
      interval: hourly
    labels:
      - dependencies
      - go
  - package-ecosystem: npm
    directory: website
    schedule:
      interval: every-so-often
    labels:
      - dependencies
      - website
